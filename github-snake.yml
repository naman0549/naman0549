name: Generate Snake Contribution Animation

on:
  schedule:
    # Runs once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: naman0549
          outputs: |
            dist/github-snake.svg?color_snake=%23ff4fd8&color_dots=%232a1240,%233a1a52,%235a2a7a,%239b4dff,%23ff4fd8
            dist/github-snake-dark.svg?color_snake=%235ef2ff&color_dots=%2312001a,%232a1240,%235a2a7a,%239b4dff,%23ff4fd8
            dist/github-snake.gif?color_snake=%23ff4fd8&color_dots=%232a1240,%233a1a52,%235a2a7a,%239b4dff,%23ff4fd8

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

<svg width="480" height="210" viewBox="0 0 480 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Naman Sharma GitHub stats card">
  <defs>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0a28"/>
      <stop offset="100%" stop-color="#12001c"/>
    </linearGradient>
    <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4fd8"/>
      <stop offset="100%" stop-color="#9b4dff"/>
    </linearGradient>
    <filter id="gw" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
</defs>
  <rect x="1" y="1" width="478" height="208" rx="16" fill="url(#cg)" stroke="#5a2a7a" stroke-width="1.3"/>
  <text x="24" y="34" font-family="'Segoe UI',sans-serif" font-size="17" font-weight="800" fill="#ffffff">GitHub Stats</text>

  <g transform="translate(95,120)">
    <circle r="46" fill="none" stroke="#3a1a52" stroke-width="10"/>
    <circle r="46" fill="none" stroke="url(#ag)" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="225.4 289.0" transform="rotate(-90)" filter="url(#gw)">
      <animate attributeName="stroke-dasharray" values="0 289.0; 225.4 289.0" dur="1.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
    </circle>
    <text x="0" y="6" text-anchor="middle" font-family="'Fira Code',monospace" font-size="20" font-weight="800" fill="#ffffff">A+</text>
  </g>

  <g transform="translate(210,40)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.50s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="60,0; 0,0" dur="0.5s" begin="0.50s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
      <text x="0" y="0" font-family="'Segoe UI',sans-serif" font-size="14" fill="#c9a8e8">Total Stars</text>
      <text x="240" y="0" text-anchor="end" font-family="'Fira Code',monospace" font-size="15" font-weight="700" fill="#ffffff">6</text>
    </g><g transform="translate(210,78)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.70s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="60,0; 0,0" dur="0.5s" begin="0.70s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
      <text x="0" y="0" font-family="'Segoe UI',sans-serif" font-size="14" fill="#c9a8e8">Total Commits</text>
      <text x="240" y="0" text-anchor="end" font-family="'Fira Code',monospace" font-size="15" font-weight="700" fill="#ffffff">180+</text>
    </g><g transform="translate(210,116)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.90s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="60,0; 0,0" dur="0.5s" begin="0.90s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
      <text x="0" y="0" font-family="'Segoe UI',sans-serif" font-size="14" fill="#c9a8e8">Repositories</text>
      <text x="240" y="0" text-anchor="end" font-family="'Fira Code',monospace" font-size="15" font-weight="700" fill="#ffffff">5</text>
    </g><g transform="translate(210,154)" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.10s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" additive="sum" values="60,0; 0,0" dur="0.5s" begin="1.10s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
      <text x="0" y="0" font-family="'Segoe UI',sans-serif" font-size="14" fill="#c9a8e8">Followers</text>
      <text x="240" y="0" text-anchor="end" font-family="'Fira Code',monospace" font-size="15" font-weight="700" fill="#ffffff">1</text>
    </g>
</svg>

<svg width="480" height="210" viewBox="0 0 480 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Naman Sharma most used languages card">
  <defs>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0a28"/>
      <stop offset="100%" stop-color="#12001c"/>
    </linearGradient>
    <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4fd8"/>
      <stop offset="100%" stop-color="#9b4dff"/>
    </linearGradient>
    <filter id="gw" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
</defs>
  <rect x="1" y="1" width="478" height="208" rx="16" fill="url(#cg)" stroke="#5a2a7a" stroke-width="1.3"/>
  <text x="24" y="30" font-family="'Segoe UI',sans-serif" font-size="17" font-weight="800" fill="#ffffff">Most Used Languages</text>
  <g transform="translate(120,46)">
      <text x="-10" y="5" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="12.5" fill="#e6d6f5">Java</text>
      <rect x="0" y="-6" width="340" height="12" rx="6" fill="#2a1240"/>
      <rect x="0" y="-6" width="0" height="12" rx="6" fill="#e08a2c">
        <animate attributeName="width" from="0" to="142.8" dur="1s" begin="0.30s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
      </rect>
      <text x="350" y="5" font-family="'Fira Code',monospace" font-size="11.5" fill="#c9a8e8">42%</text>
    </g><g transform="translate(120,76)">
      <text x="-10" y="5" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="12.5" fill="#e6d6f5">JavaScript</text>
      <rect x="0" y="-6" width="340" height="12" rx="6" fill="#2a1240"/>
      <rect x="0" y="-6" width="0" height="12" rx="6" fill="#e8d44d">
        <animate attributeName="width" from="0" to="91.8" dur="1s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
      </rect>
      <text x="350" y="5" font-family="'Fira Code',monospace" font-size="11.5" fill="#c9a8e8">27%</text>
    </g><g transform="translate(120,106)">
      <text x="-10" y="5" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="12.5" fill="#e6d6f5">HTML/CSS</text>
      <rect x="0" y="-6" width="340" height="12" rx="6" fill="#2a1240"/>
      <rect x="0" y="-6" width="0" height="12" rx="6" fill="#e0538a">
        <animate attributeName="width" from="0" to="61.2" dur="1s" begin="0.60s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
      </rect>
      <text x="350" y="5" font-family="'Fira Code',monospace" font-size="11.5" fill="#c9a8e8">18%</text>
    </g><g transform="translate(120,136)">
      <text x="-10" y="5" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="12.5" fill="#e6d6f5">Kotlin</text>
      <rect x="0" y="-6" width="340" height="12" rx="6" fill="#2a1240"/>
      <rect x="0" y="-6" width="0" height="12" rx="6" fill="#a679e0">
        <animate attributeName="width" from="0" to="27.2" dur="1s" begin="0.75s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
      </rect>
      <text x="350" y="5" font-family="'Fira Code',monospace" font-size="11.5" fill="#c9a8e8">8%</text>
    </g><g transform="translate(120,166)">
      <text x="-10" y="5" text-anchor="end" font-family="'Segoe UI',sans-serif" font-size="12.5" fill="#e6d6f5">Other</text>
      <rect x="0" y="-6" width="340" height="12" rx="6" fill="#2a1240"/>
      <rect x="0" y="-6" width="0" height="12" rx="6" fill="#9a9a9a">
        <animate attributeName="width" from="0" to="17.0" dur="1s" begin="0.90s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.3 1"/>
      </rect>
      <text x="350" y="5" font-family="'Fira Code',monospace" font-size="11.5" fill="#c9a8e8">5%</text>
    </g>
</svg>
